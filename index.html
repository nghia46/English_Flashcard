<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sight Words Flashcards - Management Mode</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheet chính -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="theme-toggle-container">
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Chuyển chế độ màu">🌙</button>
    </div>

    <div class="container">
        <h1 id="mainTitle">Sight Words Flashcards</h1>

        <div class="config-zone">
            <div class="file-upload-zone">
                <label for="fileInput" class="file-upload-label" id="fileLabel">📁 Chọn một hoặc nhiều file từ vựng
                    (.txt, .json)</label>
                <input type="file" id="fileInput" accept=".txt,.json" multiple>
            </div>

            <div class="list-selector-zone">
                <label for="listSelect">Chủ đề đang học:</label>
                <div class="selector-row">
                    <select id="listSelect" onchange="switchTopic()">
                        <option value="">-- Chưa có dữ liệu chủ đề --</option>
                    </select>
                    <button id="manageBtn" class="manage-btn" onclick="toggleCheckerPanel()"
                        title="Quản lý / Xóa nhiều chủ đề">⚙️ Quản lý</button>
                </div>
            </div>

            <!-- Cửa sổ Popup Modal Quản lý (Đóng vai trò checkerPanel mới) -->
            <div id="modalOverlay" class="modal-overlay" onclick="closeModalOnOverlay(event)">
                <div id="checkerPanel" class="checker-panel" onclick="event.stopPropagation()">
                    <div class="checker-header-main">
                        <div class="checker-title">
                            <h3>⚙️ Quản lý Bộ từ vựng</h3>
                            <p class="checker-subtitle">Xem danh sách hệ thống và quản lý file đã nạp</p>
                        </div>
                        <button class="close-modal-btn" onclick="toggleCheckerPanel()"
                            title="Đóng cửa sổ">&times;</button>
                    </div>

                    <div class="checker-actions-top">
                        <button onclick="toggleSelectAllCheckboxes()" class="action-sub-btn">Chọn tất cả Local</button>
                        <button onclick="deleteSelectedTopics()" class="danger-btn">🗑️ Xóa đã chọn</button>
                    </div>

                    <div id="checkerList" class="checker-list"></div>
                </div>
            </div>

            <div class="review-zone">
                <label for="reviewCountSelect">Số lượng từ ôn tập ngẫu nhiên:</label>
                <div class="selector-row">
                    <select id="reviewCountSelect">
                        <option value="20">20 từ</option>
                        <option value="50">50 từ</option>
                        <option value="100">100 từ</option>
                        <option value="0">Tất cả từ khả dụng</option>
                    </select>
                    <button id="startReviewBtn" onclick="startGlobalReview()" disabled>🔄 Bắt đầu ôn tập</button>
                </div>
            </div>
        </div>

        <div class="counter" id="counter">Vui lòng chọn file để bắt đầu</div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="flashcard-wrapper" onclick="flipCard()">
            <div class="flashcard" id="card">
                <div class="card-face card-front">
                    <button class="audio-btn" onclick="speakWord(event)" title="Nghe phát âm">🔊</button>
                    <div class="word" id="frontWord">Welcome</div>
                    <div class="hint-text">Bấm để xem nghĩa</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="backMeaning">Chào mừng</div>
                    <div class="hint-text">Bấm để quay lại</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn" onclick="prevCard()" disabled>Trước</button>
            <button id="nextBtn" class="primary-btn" onclick="nextCard()" disabled>Tiếp theo</button>
        </div>

        <div class="action-btns" style="justify-content: center;">
            <button id="shuffleBtn" onclick="shuffleCards()" disabled>🔀 Trộn từ</button>
            <button id="clearStorageBtn" onclick="clearSavedData()"
                style="color: #ef4444; border-color: rgba(239, 68, 68, 0.2);">🧹 Reset Ứng dụng</button>
        </div>
    </div>

    <!-- Script điều khiển Logic của Ứng dụng -->
    <script src="app.js"></script>
    
</body>

</html>
